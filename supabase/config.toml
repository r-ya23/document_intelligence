# Supabase local config. Reference: https://supabase.com/docs/guides/local-development/cli/config
# Trimmed to the sections this project actually uses (api, db, storage, realtime, edge runtime,
# studio, auth). The CLI's full default template also ships auth-provider/MFA/SMS/analytics/
# experimental blocks — omitted here since they're unused; the CLI falls back to defaults for them.
project_id = "document_intelligence"

[api]
enabled = true
# The frontend points at this port (VITE_SUPABASE_URL=http://127.0.0.1:54321).
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Must match the remote database's major version.
major_version = 17

[db.migrations]
# Applies supabase/migrations/*.sql during `supabase start` / `db reset`.
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
# Document/container lists subscribe to Realtime for live updates.
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = true
# Applies to the `documents` bucket; caps upload size.
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# Assignment scope: single-user, no real auth flows (RLS is open — see decisions.md).

[edge_runtime]
enabled = true
# `per_worker` enables hot reload locally; switch to `oneshot` if reload misbehaves.
policy = "per_worker"
inspector_port = 8083
deno_version = 2
